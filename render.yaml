# Render Blueprint for Harbor: the web service (SPA + API) and its Postgres database. Render Workflows
# are not yet supported in Blueprints, so the workflow service is created once in the Dashboard (see
# README, "Render Workflow").
databases:
  # Paid plan on purpose: Render's free Postgres has no backups and is deleted after 30 days.
  - name: harbor-db
    plan: basic-256mb
    databaseName: harbor
    postgresMajorVersion: "16"
    ipAllowList: []  # reachable only from Render services in the same region, never the internet

services:
  - type: web
    name: marlo
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: harbor-db
          property: connectionString
      # Optional: set to create the demo login demo@harbor.example with the sample data.
      - key: DEMO_PASSWORD
        sync: false
      - key: WORKFLOW_SLUG
        sync: false
      - key: RENDER_API_KEY
        sync: false
